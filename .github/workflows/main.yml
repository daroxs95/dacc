name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

concurrency:
  group: CI
  cancel-in-progress: true

jobs:
  checks:
    name: Validate app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'true'
      - name: Use Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
