services:
  dacc:
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DATABASE_PATH: /data/dacc.sqlite
    volumes:
      - dacc-data:/data
    restart: unless-stopped
volumes:
  dacc-data:
